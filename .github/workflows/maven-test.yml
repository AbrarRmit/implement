name: Java Maven Tests

on:
   push:
   pull_request:

jobs:
   test:
      name: Build and run JUnit tests
      runs-on: ubuntu-latest

      steps:
         - name: Check out repository
           uses: actions/checkout@v4

         - name: Set up JDK 17
           uses: actions/setup-java@v4
           with:
              distribution: temurin
              java-version: "17"
              cache: maven

         - name: Run Maven tests
           run: mvn test
